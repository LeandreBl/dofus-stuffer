# Optional local development. The default compose.yaml reuses an existing VPS proxy.
services:
  traefik:
    image: ${TRAEFIK_IMAGE:?}
    read_only: ${CONTAINER_READ_ONLY:?}
    cap_drop: ["${CONTAINER_CAP_DROP:?}"]
    security_opt: ["no-new-privileges:${CONTAINER_NO_NEW_PRIVILEGES:?}"]
    tmpfs: ["${CONTAINER_TMPFS:?}"]
    pids_limit: ${CONTAINER_PIDS_LIMIT:?}
    labels:
      traefik.enable: "false"
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yaml
      - --ping=true
      - --log.level=INFO
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./infra/traefik/routes.yaml:/etc/traefik/routes.yaml:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: ${TRAEFIK_HEALTH_INTERVAL:?}
      timeout: ${TRAEFIK_HEALTH_TIMEOUT:?}
      retries: ${TRAEFIK_HEALTH_RETRIES:?}
    restart: ${RESTART_POLICY:?}
    mem_limit: ${TRAEFIK_MEMORY_LIMIT:?}
    cpus: ${TRAEFIK_CPUS:?}
    networks: [existing-proxy]
  api:
    depends_on:
      traefik:
        condition: service_started
    environment:
      TRUSTED_PROXY_HOSTS: traefik
    labels:
      traefik.enable: "false"
  # Vite en mode dev (HMR) à la place de nginx ; les node_modules Linux/musl vivent dans des volumes.
  web:
    image: ${NODE_IMAGE:?}
    build: !reset null
    user: "0:0"
    read_only: false
    working_dir: /app
    environment:
      npm_config_cache: /root/.npm
    command:
      - sh
      - -c
      - >-
        { cmp -s package-lock.json node_modules/.ci-lock || { npm ci --ignore-scripts --no-audit --no-fund && cp package-lock.json node_modules/.ci-lock; }; } &&
        npm run build -w @dofus/shared &&
        { npx tsc -p packages/shared -w --preserveWatchOutput & } &&
        exec npm run dev -w @dofus/web -- --port 80 --strictPort
    volumes:
      - .:/app:ro
      - web-node-modules:/app/node_modules
      - web-app-node-modules:/app/apps/web/node_modules
      - web-api-node-modules:/app/apps/api/node_modules
      - web-admin-node-modules:/app/apps/admin/node_modules
      - web-shared-dist:/app/packages/shared/dist
    mem_limit: 1g
    labels:
      traefik.enable: "false"
volumes:
  web-node-modules:
  web-app-node-modules:
  web-api-node-modules:
  web-admin-node-modules:
  web-shared-dist:
networks:
  existing-proxy:
    external: false
    name: ${LOCAL_PROXY_NETWORK:?}
