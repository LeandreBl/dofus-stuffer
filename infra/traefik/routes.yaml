http:
  routers:
    api:
      entryPoints: [web]
      rule: PathPrefix(`/api`) || PathPrefix(`/socket.io`)
      priority: 100
      service: api
      middlewares: [compression]
    web:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      service: web
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:3000
    web:
      loadBalancer:
        servers:
          - url: http://web:80
  middlewares:
    compression:
      compress: {}
