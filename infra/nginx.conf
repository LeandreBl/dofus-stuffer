server {
  listen ${WEB_PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  server_tokens off;
  absolute_redirect off;
  add_header_inherit merge;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /site.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /game/ {
    expires 1d;
    try_files $uri =404;
  }
  location = /characters/manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location /characters/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Admin panel: same headers, plus Google Fonts for the Organic faces.
  location /admin/ {
    add_header_inherit off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache";
    try_files $uri /admin/index.html;
  }
  # Former French class URLs.
  location /classe/ {
    rewrite ^/classe/(.*)$ /class/$1 permanent;
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
